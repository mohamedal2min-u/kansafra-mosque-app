name: kansafra_mosque
description: تطبيق مسجد كنصفرة الكبير - مواقيت الصلاة والأذان والتبرعات
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  adhan: ^2.0.0
  intl: ^0.20.3
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  http: ^1.6.0
  just_audio: ^0.10.6
  shared_preferences: ^2.5.6
  hijri: ^3.0.1
  google_sign_in: ^6.2.2
  permission_handler: ^11.4.0
  just_audio_background: ^0.0.1-beta.17
  path_provider: ^2.1.6
  connectivity_plus: ^7.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal_400Regular.ttf
        - asset: assets/fonts/Tajawal_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal_700Bold.ttf
          weight: 700
    - family: NotoNaskh
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
  assets:
    - assets/quran.json
    - assets/tafsir/
    - assets/LICENSE-quran.txt
    - assets/adhan/
    - assets/pay/
    - assets/photos/
    - assets/logo/logo_192.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo/icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/logo/foreground.png
