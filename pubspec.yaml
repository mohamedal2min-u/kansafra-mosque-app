name: kansafra_mosque
description: تطبيق مسجد كنصفرة الكبير - مواقيت الصلاة والأذان والتبرعات
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  adhan: ^2.0.0
  intl: ^0.20.3
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  http: ^1.6.0
  just_audio: ^0.10.6
  shared_preferences: ^2.5.6
  hijri: ^3.0.1
  google_sign_in: ^6.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/quran.json
    - assets/LICENSE-quran.txt
    - assets/adhan/
    - assets/pay/
    - assets/photos/
    - assets/logo/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo/icon.png
  adaptive_icon_background: assets/logo/background.png
  adaptive_icon_foreground: assets/logo/foreground.png
