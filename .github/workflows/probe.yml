name: probe-urls
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: mp3quran radios API
        run: |
          curl -sS -m 30 "https://www.mp3quran.net/api/v3/radios?language=ar" -o radios.json; head -c 1500 radios.json; echo
          python3 -c "import json;d=json.load(open('radios.json'));r=d.get('radios',d);print('count',len(r));[print(x) for x in r[:200] if any(w in x.get('name','') for w in ['إذاعة','القاهرة','السعودية','تفسير','قرآن','القرآن'])]"
      - name: known Quran radio streams
        run: |
          for u in https://stream.radiojar.com/0tpy1h0kxtzuv https://n0e.radiojar.com/8s5u5tpdtwzuv https://qurango.net/radio/tarateel https://backup.qurango.net/radio/tarateel; do
            echo "== $u"; curl -sS -m 15 -L -r 0-200 -o /dev/null -D - "$u" | grep -iE "^HTTP|content-type|location" | head -6
          done
