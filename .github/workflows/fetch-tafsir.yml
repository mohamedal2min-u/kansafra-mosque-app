name: fetch-tafsir
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_tafsir.py
      - name: Commit tafsir data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add assets/tafsir/muyassar.json
          git commit -m "Add Tafsir al-Muyassar data (offline)" || echo "no change"
          git push
