name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare signing key (if secrets are set)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::notice::SIGNING=debug-key (secret ANDROID_KEYSTORE_BASE64 missing)"
            exit 0
          fi
          printf '%s' "$KS_B64" | tr -d ' \n\r\t"' > ks.b64
          len=$(wc -c < ks.b64)
          if ! base64 -d ks.b64 > android/app/release.jks 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 (length after cleanup: $len, expected 3560). Paste it again as ONE line."
            exit 1
          fi
          if ! keytool -list -keystore android/app/release.jks -storepass "$KS_PASS" >/dev/null 2>&1; then
            echo "::error::Keystore decoded ($len chars) but cannot be opened: check ANDROID_KEYSTORE_PASSWORD or that the base64 is complete (expected length 3560)."
            exit 1
          fi
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=kansafra\n' "$KS_PASS" "$KS_PASS" > android/key.properties
          echo "::notice::SIGNING=release-key (base64 length $len)"
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - name: Build APK
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 > build.log 2>&1 || {
            msg=$(grep -E "(rror|What went wrong|FAILURE|Could not|requires|not found)" -A3 build.log | head -25 | tr '\n' '|' | cut -c1-1800)
            echo "::error::BUILD FAILED: $msg"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: kansafra-mosque-apk
          path: build/app/outputs/flutter-apk/*-release.apk
      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: نسخة تجريبية ${{ github.run_number }}
          prerelease: true
          body: |
            حمّل **app-arm64-v8a-release.apk** (يناسب معظم الهواتف الحديثة). للهواتف القديمة جدًا: app-armeabi-v7a-release.apk.
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
