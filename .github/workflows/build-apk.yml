name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: kansafra-mosque-apk
          path: build/app/outputs/flutter-apk/*-release.apk
      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: نسخة تجريبية ${{ github.run_number }}
          prerelease: true
          body: |
            حمّل **app-arm64-v8a-release.apk** (يناسب معظم الهواتف الحديثة). للهواتف القديمة جدًا: app-armeabi-v7a-release.apk.
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
