name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare signing key (if secrets are set)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_P1: ${{ secrets.ANDROID_KEYSTORE_PART1 }}
          KS_P2: ${{ secrets.ANDROID_KEYSTORE_PART2 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_P1" ] && [ -n "$KS_P2" ]; then KS_B64="$KS_P1$KS_P2"; fi
          if [ -z "$KS_B64" ]; then
            echo "::notice::SIGNING=debug-key (secret ANDROID_KEYSTORE_BASE64 missing)"
            exit 0
          fi
          printf '%s' "$KS_B64" | tr -d ' \n\r\t"' > ks.b64
          len=$(wc -c < ks.b64)
          if ! base64 -d ks.b64 > android/app/release.jks 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 (length after cleanup: $len, expected 3560; part1 ${#KS_P1}, part2 ${#KS_P2}, expected 1780 each). Paste it again as ONE line."
            exit 1
          fi
          if ! keytool -list -keystore android/app/release.jks -storepass "$KS_PASS" >/dev/null 2>&1; then
            echo "::error::Keystore decoded ($len chars) but cannot be opened: check ANDROID_KEYSTORE_PASSWORD or that the base64 is complete (expected length 3560)."
            exit 1
          fi
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=kansafra\n' "$KS_PASS" "$KS_PASS" > android/key.properties
          echo "::notice::SIGNING=release-key (base64 length $len)"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build APK (both apps)
        run: |
          # تطبيقان من الكود نفسه: مسجد كنصفرة (kansafra) ورفيق المسلم (rafiq).
          opts="--release --split-debug-info=build/symbols --build-name=1.0.0 --build-number=$GITHUB_RUN_NUMBER"
          : > build.log
          for f in kansafra rafiq; do
            flutter build apk $opts --flavor $f --split-per-abi --target-platform android-arm,android-arm64 >> build.log 2>&1 &&
            flutter build appbundle $opts --flavor $f >> build.log 2>&1 || {
              msg=$(grep -E "(rror|What went wrong|FAILURE|Could not|requires|not found)" -A3 build.log | head -25 | tr '\n' '|' | cut -c1-1800)
              echo "::error::BUILD FAILED ($f): $msg"
              exit 1
            }
          done
          # أسماء ثابتة: روابط تطبيق كنصفرة القديمة تبقى كما هي، ورفيق المسلم بأسماء rafiq-*.
          # نبحث بالنمط لأن ترتيب أجزاء الاسم (النسخة/المعالج) يختلف بين إصدارات أدوات البناء.
          find build/app/outputs -name "*.apk" -o -name "*.aab"
          mkdir -p out
          pick() { f=$(find build/app/outputs -name "$1" | head -1); [ -n "$f" ] || { echo "::error::missing $1"; exit 1; }; cp "$f" "out/$2"; }
          pick "*kansafra*arm64*release.apk" app-arm64-v8a-release.apk
          pick "*kansafra*armeabi*release.apk" app-armeabi-v7a-release.apk
          pick "*kansafra*release.aab" app-release.aab
          pick "*rafiq*arm64*release.apk" rafiq-arm64-v8a-release.apk
          pick "*rafiq*armeabi*release.apk" rafiq-armeabi-v7a-release.apk
          pick "*rafiq*release.aab" rafiq-release.aab
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: apps
          path: out/*
      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: نسخة تجريبية ${{ github.run_number }}
          prerelease: true
          body: |
            **مسجد كنصفرة الكبير:** app-arm64-v8a-release.apk (للهواتف القديمة جدًا: app-armeabi-v7a-release.apk).
            **رفيق المسلم:** rafiq-arm64-v8a-release.apk (للهواتف القديمة جدًا: rafiq-armeabi-v7a-release.apk).
          files: out/*
