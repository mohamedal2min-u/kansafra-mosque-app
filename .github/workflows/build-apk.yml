name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare signing key (if secrets are set)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=kansafra\n' "$KS_PASS" "$KS_PASS" > android/key.properties
            echo "Signing with the release key"
          else
            echo "No release key: debug signing"
          fi
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - name: Build APK
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 > build.log 2>&1 || {
            msg=$(grep -E "(rror|What went wrong|FAILURE|Could not|requires|not found)" -A3 build.log | head -25 | tr '\n' '|' | cut -c1-1800)
            echo "::error::BUILD FAILED: $msg"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: kansafra-mosque-apk
          path: build/app/outputs/flutter-apk/*-release.apk
      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: نسخة تجريبية ${{ github.run_number }}
          prerelease: true
          body: |
            حمّل **app-arm64-v8a-release.apk** (يناسب معظم الهواتف الحديثة). للهواتف القديمة جدًا: app-armeabi-v7a-release.apk.
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
